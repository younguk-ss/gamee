<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Hollow Jump - 동네 에디션</title>
<!-- Supabase JS SDK CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { 
    box-sizing: border-box; 
    user-select: none; 
    -webkit-user-select: none; 
    margin: 0; 
    padding: 0; 
  }
  body {
    background: #090d16;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    padding: 10px;
  }
  
  #game-wrapper {
    position: relative;
    width: 100%;
    max-width: 960px;
    height: 68vh;
    max-height: 540px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.25);
    border-radius: 16px;
    overflow: hidden;
    background: #1e293b;
    border: 2px solid rgba(255, 255, 255, 0.12);
  }
  
  canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(9, 13, 22, 0.88);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-card {
    background: rgba(30, 41, 59, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    text-align: center;
  }

  .modal-title {
    font-size: 28px;
    font-weight: 800;
    color: #38bdf8;
    margin-bottom: 8px;
    text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
  }

  .time-badge {
    display: inline-block;
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid #38bdf8;
    color: #7dd3fc;
    font-size: 20px;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 20px;
    margin: 10px 0 16px 0;
  }

  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .nickname-input {
    flex: 1;
    background: rgba(15, 23, 42, 0.8);
    border: 1.5px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    padding: 12px 16px;
    color: #fff;
    font-size: 15px;
    outline: none;
  }

  .nickname-input:focus {
    border-color: #38bdf8;
  }

  .submit-btn {
    background: #0284c7;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
  }

  .submit-btn:active {
    background: #0369a1;
  }

  .leaderboard-box {
    max-height: 180px;
    overflow-y: auto;
    background: rgba(15, 23, 42, 0.6);
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    margin-bottom: 16px;
  }

  .leaderboard-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    text-align: left;
  }

  .leaderboard-table th {
    background: rgba(30, 41, 59, 0.8);
    padding: 8px 12px;
    color: #94a3b8;
    font-size: 12px;
    position: sticky;
    top: 0;
  }

  .leaderboard-table td {
    padding: 8px 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .rank-1 { color: #facc15; font-weight: bold; }
  .rank-2 { color: #e2e8f0; font-weight: bold; }
  .rank-3 { color: #f97316; font-weight: bold; }

  .restart-btn {
    width: 100%;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #fff;
    border-radius: 12px;
    padding: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .restart-btn:active {
    background: rgba(255, 255, 255, 0.2);
  }

  .touch-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 960px;
    padding: 12px 5px 5px 5px;
    gap: 12px;
  }
  
  .d-pad { 
    display: flex; 
    gap: 12px; 
  }
  
  .btn {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1.5px solid rgba(255, 255, 255, 0.25);
    color: #ffffff;
    font-size: 22px;
    font-weight: bold;
    border-radius: 16px;
    padding: 16px 32px;
    touch-action: manipulation;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    transition: all 0.1s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .btn:active { 
    background: rgba(56, 189, 248, 0.5); 
    border-color: #38bdf8;
    transform: scale(0.95);
  }
  
  .btn-jump { 
    padding: 16px 44px; 
    background: rgba(56, 189, 248, 0.35); 
    border-color: rgba(125, 211, 252, 0.6);
    font-size: 17px;
    letter-spacing: 1px;
  }

  @media (max-height: 500px) {
    #game-wrapper { height: 62vh; }
    .btn { padding: 10px 24px; font-size: 18px; }
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="canvas" width="960" height="540"></canvas>
  
  <!-- 스테이지 클리어 & 리더보드 모달 -->
  <div id="clear-overlay" class="overlay">
    <div class="modal-card">
      <div class="modal-title">🎉 STAGE CLEAR!</div>
      <div>클리어 소요 시간</div>
      <div id="clear-time-text" class="time-badge">00:00.00</div>

      <div class="input-group" id="input-section">
        <input type="text" id="nickname" class="nickname-input" placeholder="이름/닉네임 입력 (최대 8자)" maxlength="8">
        <button id="btn-submit-score" class="submit-btn">기록 등록</button>
      </div>

      <div class="leaderboard-box">
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>순위</th>
              <th>이름</th>
              <th style="text-align: right;">기록</th>
            </tr>
          </thead>
          <tbody id="leaderboard-tbody">
            <tr><td colspan="3" style="text-align: center; color: #64748b; padding: 16px;">기록을 불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>

      <button id="btn-restart" class="restart-btn">다시 플레이 🔄</button>
    </div>
  </div>
</div>

<div class="touch-controls">
  <div class="d-pad">
    <button class="btn" id="btn-left">◀</button>
    <button class="btn" id="btn-right">▶</button>
  </div>
  <button class="btn btn-jump" id="btn-jump">JUMP ⬆</button>
</div>

<script>
const RAW_SUPABASE_URL = 'https://xhvmftqoznbgyihbxlyi.supabase.co/rest/v1/';
const SUPABASE_URL = RAW_SUPABASE_URL.replace(/\/rest\/v1\/?$/, '');
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhodm1mdHFvem5iZ3lpaGJ4bHlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2Nzk3NjUsImV4cCI6MjEwNDI1NTc2NX0.O0Ayhhlg8UJIL0tSKp43I4BUhYR_u0qvOw236kDzrSs';

let supabaseClient = null;

try {
  if (window.supabase && typeof window.supabase.createClient === 'function') {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
} catch (e) {
  console.error('Supabase Client Init Error:', e);
}

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const WORLD_WIDTH = 1600;
const WORLD_HEIGHT = 540;

// 동네 사진 배경
const bgImage = new Image();
bgImage.src = 'bg.png';
let bgLoaded = false;
bgImage.onload = () => { bgLoaded = true; };

const player = {
  x: 60,
  y: 350,
  width: 28,
  height: 42,
  vx: 0,
  vy: 0,
  speed: 5.2,
  jumpForce: 11.8,
  gravity: 0.5,
  grounded: false,
  jumpCount: 0,
  maxJumps: 2
};

const platforms = [
  { x: 0, y: 440, width: 220, height: 100 },
  { x: 280, y: 370, width: 140, height: 24 },
  { x: 480, y: 290, width: 130, height: 24 },
  { x: 680, y: 210, width: 130, height: 24 },
  { x: 880, y: 280, width: 140, height: 24 },
  { x: 1100, y: 360, width: 140, height: 24 },
  { x: 1320, y: 420, width: 280, height: 120 }
];

const exitDoor = { x: 1500, y: 330, width: 50, height: 90 };

let stageClear = false;
let startTime = Date.now();
let elapsedTime = 0;
let isRecordSubmitted = false;

const keys = { left: false, right: false };

window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft') keys.left = true;
  if (e.code === 'ArrowRight') keys.right = true;
  if (e.code === 'Space' && !e.repeat) doJump();
});

window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft') keys.left = false;
  if (e.code === 'ArrowRight') keys.right = false;
});

function setupTouch(id, onStart, onEnd) {
  const el = document.getElementById(id);
  const handleStart = (e) => { e.preventDefault(); onStart(); };
  const handleEnd = (e) => { e.preventDefault(); onEnd(); };
  
  el.addEventListener('touchstart', handleStart);
  el.addEventListener('touchend', handleEnd);
  el.addEventListener('mousedown', handleStart);
  el.addEventListener('mouseup', handleEnd);
}

setupTouch('btn-left', () => keys.left = true, () => keys.left = false);
setupTouch('btn-right', () => keys.right = true, () => keys.right = false);
setupTouch('btn-jump', () => doJump(), () => {});

function doJump() {
  if (stageClear) return;
  if (player.jumpCount < player.maxJumps) {
    player.vy = -player.jumpForce;
    player.jumpCount++;
    player.grounded = false;
  }
}

function resetGame() {
  player.x = 60;
  player.y = 350;
  player.vx = 0;
  player.vy = 0;
  player.jumpCount = 0;
  stageClear = false;
  isRecordSubmitted = false;
  startTime = Date.now();
  elapsedTime = 0;
  
  document.getElementById('clear-overlay').classList.remove('active');
  document.getElementById('input-section').style.display = 'flex';
  document.getElementById('nickname').value = '';
}

function checkAABB(r1, r2) {
  return r1.x < r2.x + r2.width &&
         r1.x + r1.width > r2.x &&
         r1.y < r2.y + r2.height &&
         r1.y + r1.height > r2.y;
}

function update() {
  if (stageClear) return;

  // 타이머 갱신
  elapsedTime = Date.now() - startTime;

  if (keys.left) player.vx = -player.speed;
  else if (keys.right) player.vx = player.speed;
  else player.vx = 0;

  // X축 이동 및 충돌
  player.x += player.vx;
  if (player.x < 0) player.x = 0;

  for (let p of platforms) {
    if (checkAABB(player, p)) {
      if (player.vx > 0) player.x = p.x - player.width;
      else if (player.vx < 0) player.x = p.x + p.width;
    }
  }

  // Y축 이동 및 충돌 (관통 방지)
  const prevY = player.y;
  player.vy += player.gravity;
  player.y += player.vy;
  player.grounded = false;

  for (let p of platforms) {
    if (checkAABB(player, p)) {
      if (player.vy > 0 && (prevY + player.height) <= p.y + 14) {
        player.y = p.y - player.height;
        player.vy = 0;
        player.grounded = true;
        player.jumpCount = 0;
      } else if (player.vy < 0) {
        player.y = p.y + p.height;
        player.vy = 0;
      }
    }
  }

  // 추락 리셋
  if (player.y > WORLD_HEIGHT + 100) resetGame();

  // 출구 도달시 클리어 처리
  if (checkAABB(player, exitDoor)) {
    stageClear = true;
    onStageClear();
  }
}

function formatTime(ms) {
  const totalSeconds = ms / 1000;
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = Math.floor(totalSeconds % 60);
  const centiseconds = Math.floor((ms % 1000) / 10);
  
  const mm = String(minutes).padStart(2, '0');
  const ss = String(seconds).padStart(2, '0');
  const cs = String(centiseconds).padStart(2, '0');
  return `${mm}:${ss}.${cs}`;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let camX = player.x - canvas.width / 3;
  camX = Math.max(0, Math.min(camX, WORLD_WIDTH - canvas.width));

  // 1. 배경 이미지 패럴랙스
  if (bgLoaded) {
    const bgX = -(camX * 0.35) % canvas.width;
    ctx.drawImage(bgImage, bgX, 0, canvas.width, canvas.height);
    ctx.drawImage(bgImage, bgX + canvas.width, 0, canvas.width, canvas.height);
    if (bgX < 0) {
      ctx.drawImage(bgImage, bgX + canvas.width * 2, 0, canvas.width, canvas.height);
    }
    ctx.fillStyle = 'rgba(15, 23, 42, 0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else {
    const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGrad.addColorStop(0, '#38bdf8');
    bgGrad.addColorStop(0.5, '#1e40af');
    bgGrad.addColorStop(1, '#0f172a');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  ctx.save();
  ctx.translate(-camX, 0);

  // 2. 발판 그리기
  for (let p of platforms) {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, p.width, p.height, 8);
    ctx.fill();

    ctx.fillStyle = 'rgba(30, 41, 59, 0.85)';
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, p.width, p.height - 4, 8);
    ctx.fill();

    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, p.width, 5, [6, 6, 0, 0]);
    ctx.fill();

    ctx.strokeStyle = '#60a5fa';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(p.x, p.y, p.width, p.height - 4, 8);
    ctx.stroke();
  }

  // 3. 출구 게이트
  ctx.fillStyle = 'rgba(56, 189, 248, 0.35)';
  ctx.beginPath();
  ctx.arc(exitDoor.x + exitDoor.width/2, exitDoor.y + exitDoor.height/2, 45, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#0284c7';
  ctx.beginPath();
  ctx.roundRect(exitDoor.x, exitDoor.y, exitDoor.width, exitDoor.height, 12);
  ctx.fill();
  ctx.strokeStyle = '#7dd3fc';
  ctx.lineWidth = 3;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 18px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('EXIT', exitDoor.x + exitDoor.width / 2, exitDoor.y + exitDoor.height / 2 + 6);

  // 4. 캐릭터
  ctx.fillStyle = 'rgba(56, 189, 248, 0.3)';
  ctx.beginPath();
  ctx.arc(player.x + player.width/2, player.y + player.height/2, 22, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.roundRect(player.x, player.y, player.width, player.height, 8);
  ctx.fill();
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  ctx.fillStyle = '#0284c7';
  const eyeOffset = player.vx < 0 ? 5 : (player.vx > 0 ? 15 : 10);
  ctx.fillRect(player.x + eyeOffset, player.y + 10, 5, 8);
  ctx.fillRect(player.x + eyeOffset + 6, player.y + 10, 5, 8);

  ctx.restore();

  if (!stageClear) {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
    ctx.beginPath();
    ctx.roundRect(16, 16, 150, 36, 10);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = '#38bdf8';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`⏱️ ${formatTime(elapsedTime)}`, 28, 40);
  }
}

async function fetchLeaderboard() {
  const tbody = document.getElementById('leaderboard-tbody');
  
  if (!supabaseClient) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#94a3b8; padding:12px;">Supabase 연결 대기 중</td></tr>';
    return;
  }

  try {
    const { data, error } = await supabaseClient
      .from('rankings')
      .select('name, time')
      .order('time', { ascending: true })
      .limit(10);

    if (error) {
      console.error('Leaderboard fetch error:', error);
      tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#f87171; padding:12px;">불러오기 실패: ${error.message}</td></tr>`;
      return;
    }

    if (!data || data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#94a3b8; padding:12px;">등록된 기록이 없습니다. 첫 주인공이 되세요!</td></tr>';
      return;
    }

    tbody.innerHTML = data.map((item, idx) => {
      const rankClass = idx === 0 ? 'rank-1' : (idx === 1 ? 'rank-2' : (idx === 2 ? 'rank-3' : ''));
      const rankBadge = idx === 0 ? '🥇 1' : (idx === 1 ? '🥈 2' : (idx === 2 ? '🥉 3' : `${idx + 1}`));
      
      // time 컬럼 값(밀리초 또는 초) 유연하게 파싱
      let rawTime = Number(item.time) || 0;
      if (rawTime < 1000 && rawTime > 0) rawTime = rawTime * 1000;

      return `
        <tr>
          <td class="${rankClass}">${rankBadge}</td>
          <td>${escapeHtml(item.name || '익명')}</td>
          <td style="text-align: right; font-family: monospace; font-weight: bold;">${formatTime(rawTime)}</td>
        </tr>
      `;
    }).join('');

  } catch (err) {
    console.error('Fetch exception:', err);
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#f87171; padding:12px;">네트워크 연결 오류</td></tr>';
  }
}

async function submitRecord() {
  if (isRecordSubmitted) return;

  const nicknameInput = document.getElementById('nickname');
  const name = nicknameInput.value.trim() || '익명';
  const submitBtn = document.getElementById('btn-submit-score');

  if (!supabaseClient) {
    alert('Supabase 연결 상태를 확인해주세요.');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.innerText = '등록 중...';

  try {
    const { error } = await supabaseClient
      .from('rankings')
      .insert([{ name: name, time: elapsedTime }]);

    if (error) {
      console.error('Record insert error:', error);
      alert(`기록 등록 실패: ${error.message}\n(Supabase SQL Editor에서 RLS 권한 정책을 확인하세요)`);
      submitBtn.disabled = false;
      submitBtn.innerText = '기록 등록';
      return;
    }

    isRecordSubmitted = true;
    document.getElementById('input-section').style.display = 'none';
    fetchLeaderboard();

  } catch (err) {
    console.error('Submit exception:', err);
    alert('기록 등록 도중 오류가 발생했습니다.');
    submitBtn.disabled = false;
    submitBtn.innerText = '기록 등록';
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.innerText = text;
  return div.innerHTML;
}

function onStageClear() {
  document.getElementById('clear-time-text').innerText = formatTime(elapsedTime);
  document.getElementById('clear-overlay').classList.add('active');
  fetchLeaderboard();
}

document.getElementById('btn-submit-score').addEventListener('click', submitRecord);
document.getElementById('btn-restart').addEventListener('click', resetGame);
document.getElementById('nickname').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') submitRecord();
});

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
